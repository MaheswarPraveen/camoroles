name: Daily Job Ingestion & Liveness Check

on:
  schedule:
    # 23:30 UTC = 5:00 AM IST every day
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI anytime

jobs:
  crawl-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest Official Y Combinator Jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scrapers/ycombinator_scraper.py

      - name: Crawl 2500+ Worldwide & Indian ATS Portals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scrapers/crawl_catalogue.py

      - name: Verify URL Liveness & Prune Closed Roles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scrapers/liveness.py
